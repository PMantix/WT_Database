# Hand-curated overrides — applied LAST over datamine, field-level.
# game_id MUST match a datamine id (see wt.db). Only set fields you want to
# override; unset fields keep the datamine value. Strategy notes below were
# carried over from the Phase-1 placeholder seed and re-keyed to real ids.

- game_id: p-51d-30_usaaf_korea
  notes: Classic energy fighter / BnZ. Great top speed and dive; do NOT turnfight.
- game_id: p-47d-28
  notes: Heavy BnZ bruiser. Excellent dive and roll, poor climb. Energy fight only.
- game_id: bf-109e-3
  notes: Energy fighter. Climbs well, decent at altitude. Avoid sustained turns vs biplanes.
- game_id: bf-109f-4
  notes: Excellent climber and energy fighter. One of the best F-series.
- game_id: fw-190a-5
  notes: Boom-and-zoom. Superb roll rate and firepower. Never turnfight; dive and extend.
- game_id: ju-87b-2
  notes: Stuka. Precision dive bombing of ground/naval targets. Helpless vs fighters.
- game_id: me-262a-1a
  notes: First jet. Devastating 30mm. Energy only — slow accel, terrible turn, fragile.
- game_id: i-16_type24
  notes: Rugged turnfighter with hard-hitting cannons. Energy retention is poor.
- game_id: yak-3
  notes: Premier low-alt dogfighter. Superb climb + turn under 3000m. Fragile, light armament.
- game_id: la-7
  notes: Energy fighter with great climb and acceleration at low alt.
- game_id: il_2_1941
  notes: Armored ground-attacker (Sturmovik). Tanks rounds; deadly to ground, sluggish in air.
- game_id: mig-15
  notes: Outstanding climb and acceleration. Hard-hitting but low-velocity guns; snaps in hard maneuvers.
- game_id: hurricane_mk1
  notes: Forgiving turnfighter. Stable gun platform, gentle stall. Weak rifle-caliber armament.
- game_id: spitfire_mk5b
  notes: Excellent turnfighter and climber. Out-turns most contemporaries; energy is mediocre.
- game_id: spitfire_mk9c_4cannons
  notes: 'All-rounder: great climb and turn. Can hang with 109s/190s if you keep energy.'
- game_id: tempest_mkv
  notes: Fast BnZ with brutal 20mm battery. Great dive/roll; mediocre sustained turn.
- game_id: ki_43_2
  notes: Phenomenal turnfighter (combat flaps). Tiny armament; never try to BnZ in it.
- game_id: a6m2_zero
  notes: Iconic turnfighter with cannons. Rips wings in high-speed dives — stay slow and turn.
- game_id: ki_84_ko
  notes: 'Rare Japanese all-rounder: fast, climbs, AND turns. Energy fights and dogfights both.'
- game_id: j2m3
  notes: 'Interceptor: superb climb and heavy cannon battery. Climb to alt, dive on bombers/fighters.'
