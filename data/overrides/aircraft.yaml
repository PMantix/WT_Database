# =============================================================================
# Hand-curated aircraft seed data  (Phase 1)
# =============================================================================
# These are APPROXIMATE, hand-entered values for a representative cross-section
# of well-known aircraft, used to stand up the app before the datamine scraper
# (Phase 2) exists. BRs and flight-model figures drift every patch — treat these
# as placeholders. The Phase-2 pipeline reads exact values from the datamine and
# merges this file LAST, so any field you correct here will win over the scrape.
#
# Fields: game_id (unique), name, nation, aircraft_class, rank, acquisition,
#   br_ab/br_rb/br_sb, max_speed_kmh, max_speed_alt_m, climb_rate_ms,
#   turn_time_s, wing_rip_kmh, mass_takeoff_kg, wing_area_m2, engine_power_hp,
#   engine_thrust_kgf, engine_count, crew, armament, notes, year.
# Classes: fighter, interceptor, heavy_fighter, strike_fighter, attacker,
#   dive_bomber, bomber, jet_fighter, jet_bomber.
# =============================================================================

