# Hand-curated overrides — applied LAST over datamine, field-level.
# game_id MUST match a datamine id (see wt.db). Only set fields you want to
# override; unset fields keep the datamine value. Strategy notes below were
# carried over from the Phase-1 placeholder seed and re-keyed to real ids.
#
# gun_layout (hand-annotated; not in the datamine config — it lives in the 3D
# models): nose/fuselage = centerline, pinpoint at any range; wing = needs
# convergence, spreads off-range; mixed = significant guns in both places.

- game_id: p-39n
  gun_layout: nose
  notes: Energy fighter. Killing punch (37mm + 2x .50) is nose-centerline = pinpoint at any range; only trivial .30s in the wings. Forgiving; lands shots easily.
- game_id: p-63a-10
  gun_layout: mixed
  notes: Heavier high-alt BnZ. 37mm + 2x .50 nose PLUS 2x .50 in wing pods that need convergence. Climb/fight high (~5km), strict energy, set convergence ~450m.
- game_id: p-63a-5
  gun_layout: mixed
  notes: Like the A-10 but lower BR; nose 37mm + 2x .50 plus wing-pod .50s. High-alt energy fighter.
- game_id: p-51d-30_usaaf_korea
  gun_layout: wing
  notes: Classic energy fighter / BnZ. Great top speed and dive; do NOT turnfight. 6x .50 all wing-mounted — mind convergence.
- game_id: p-47d-28
  gun_layout: wing
  notes: Heavy BnZ bruiser. Excellent dive and roll, poor climb. Energy fight only. 8x .50 in the wings.
- game_id: bf-109e-3
  gun_layout: mixed
  notes: Energy fighter. Climbs well, decent at altitude. Avoid sustained turns vs biplanes. Cowl MGs + wing cannons.
- game_id: bf-109f-4
  gun_layout: nose
  notes: Excellent climber and energy fighter. One of the best F-series. All guns nose-mounted = pinpoint.
- game_id: fw-190a-5
  gun_layout: mixed
  notes: Boom-and-zoom. Superb roll rate and firepower. Never turnfight; dive and extend.
- game_id: ju-87b-2
  notes: Stuka. Precision dive bombing of ground/naval targets. Helpless vs fighters.
- game_id: me-262a-1a
  gun_layout: nose
  notes: First jet. Devastating 30mm. Energy only — slow accel, terrible turn, fragile. 4x 30mm in the nose.
- game_id: i-16_type24
  gun_layout: mixed
  notes: Rugged turnfighter with hard-hitting cannons. Energy retention is poor.
- game_id: yak-3
  gun_layout: nose
  notes: Premier low-alt dogfighter. Superb climb + turn under 3000m. Fragile, light armament. Nose guns = pinpoint.
- game_id: la-7
  gun_layout: nose
  notes: Energy fighter with great climb and acceleration at low alt. 3x 20mm nose-mounted.
- game_id: il_2_1941
  gun_layout: wing
  notes: Armored ground-attacker (Sturmovik). Tanks rounds; deadly to ground, sluggish in air.
- game_id: mig-15
  gun_layout: nose
  notes: Outstanding climb and acceleration. Hard-hitting but low-velocity guns; snaps in hard maneuvers.
- game_id: hurricane_mk1
  gun_layout: wing
  notes: Forgiving turnfighter. Stable gun platform, gentle stall. Weak rifle-caliber armament (8x wing .303).
- game_id: spitfire_mk5b
  gun_layout: wing
  notes: Excellent turnfighter and climber. Out-turns most contemporaries; energy is mediocre.
- game_id: spitfire_mk9c_4cannons
  gun_layout: wing
  notes: 'All-rounder: great climb and turn. Can hang with 109s/190s if you keep energy.'
- game_id: tempest_mkv
  gun_layout: wing
  notes: Fast BnZ with brutal 20mm battery. Great dive/roll; mediocre sustained turn.
- game_id: ki_43_2
  gun_layout: nose
  notes: Phenomenal turnfighter (combat flaps). Tiny armament; never try to BnZ in it. Nose-mounted.
- game_id: a6m2_zero
  gun_layout: mixed
  notes: Iconic turnfighter with cannons. Rips wings in high-speed dives — stay slow and turn.
- game_id: ki_84_ko
  gun_layout: mixed
  notes: 'Rare Japanese all-rounder: fast, climbs, AND turns. Energy fights and dogfights both.'
- game_id: j2m3
  gun_layout: wing
  notes: 'Interceptor: superb climb and heavy cannon battery. Climb to alt, dive on bombers/fighters.'
