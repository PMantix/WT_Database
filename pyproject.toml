[project]
name = "wtdb"
version = "0.1.0"
description = "War Thunder aircraft database and analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.50",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wtdb"]

[tool.ruff]
line-length = 100
src = ["src", "app", "tests"]

[tool.ruff.lint.per-file-ignores]
# app.py inserts src/ onto sys.path before importing wtdb (cloud portability).
"app/app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
